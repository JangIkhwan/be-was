<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../reset.css" rel="stylesheet" />
    <link href="../global.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="/"><img src="../img/signiture.svg" /></a>
        <ul class="header__menu">
          <li class="header__menu__item">
            <a class="btn btn_contained btn_size_s" href="/login">로그인</a>
          </li>
          <li class="header__menu__item">
            <a class="btn btn_ghost btn_size_s" href="/registration">
              회원 가입
            </a>
          </li>
        </ul>
      </header>
      <div class="page">
        <h2 class="page-title">회원가입</h2>
        <form class="form">
          <div class="textfield textfield_size_s">
            <p class="title_textfield">아이디</p>
            <input
              class="input_textfield"
              id="userId"
              placeholder="아이디를 입력해주세요"
              autocomplete="username"
            />
          </div>
          <div class="textfield textfield_size_s">
            <p class="title_textfield">닉네임</p>
            <input
              class="input_textfield"
              id="name"
              placeholder="닉네임을 입력해주세요"
              autocomplete="username"
            />
          </div>
          <div class="textfield textfield_size_s">
            <p class="title_textfield">비밀번호</p>
            <input
              class="input_textfield"
              id="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
              autocomplete="current-password"
            />
          </div>
          <button
            id="registration-btn"
            onclick="onClickRegister(event)"
            class="btn btn_contained btn_size_m"
            style="margin-top: 24px"
            type="button"
          >
            회원가입
          </button>
        </form>
      </div>
    </div>
    <script>
      function onClickRegister(e) {
        var userId = document.getElementById("userId").value;
        var name = document.getElementById("name").value;
        var password = document.getElementById("password").value;

        alert(userId);
        fetch("http://localhost:8080/create?userId=" + userId + "&name=" + name + "&password=" + password,
          {
            method: "GET"
          }
        );
      }
    </script>
  </body>
</html>
