<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../reset.css" rel="stylesheet"/>
    <link href="../global.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <header class="header">
        <a href="/"><img src="../img/signiture.svg"/></a>
        <ul class="header__menu">
            <li class="header__menu__item">
                <a class="btn btn_contained btn_size_s" href="/article/create-form">글쓰기</a>
            </li>
            <li class="header__menu__item">
                <form action="/logout" method="post" style="display:inline;">
                    <button type="submit" class="btn btn_ghost btn_size_s">
                        로그아웃
                    </button>
                </form>
            </li>
        </ul>
    </header>
    <div class="page">
        <h2 class="page-title">마이페이지</h2>

        <div class="profile_container">
            <div class="profile_box">
                <div class="profile_image">
                    <img class="profile" src="${{profile_image}}"/>
                </div>
                <div class="profile_frame">
                    <div class="btn_profile" onclick="onClickChangeButton()">
                        <div class="btn_container" >수정</div>
                    </div>
                    <div class="btn_bar"></div>
                    <div class="btn_profile">
                        <div class="btn_container" onclick="">삭제</div>
                    </div>
                </div>
            </div>
            <form class="form">
                <input
                        type="file"
                        id="image"
                        accept="image/*"
                        style="display: none;"
                />
                <div class="textfield textfield_size_s input_margin">
                    <p class="title_textfield">닉네임</p>
                    <input
                            class="input_textfield"
                            placeholder="${{name}}"
                            autocomplete="username"
                    />
                </div>
                <div class="textfield textfield_size_s">
                    <p class="title_textfield">비밀번호</p>
                    <input
                            class="input_textfield"
                            placeholder="비밀번호를 변경할 경우 입력해주세요"
                            autocomplete="current-password"
                    />
                </div>
                <div class="textfield textfield_size_s">
                    <p class="title_textfield">비밀번호 확인</p>
                    <input
                            class="input_textfield"
                            type="password"
                            placeholder="한 번 더 입력해주세요"
                            autocomplete="current-password"
                    />
                </div>
                <button
                        id="registration-btn"
                        class="btn btn_contained btn_size_m input_margin"

                        type="button"
                >
                    변경사항 저장
                </button>
            </form>
        </div>
    </div>
</div>
<script>
    function onClickChangeButton() {
        document.querySelector('#image').click();
    }

    document.querySelector('#image').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        selectedImageFile = file; // 저장만

        // 미리보기
        const img = document.querySelector('.profile');
        img.src = URL.createObjectURL(file);
    });


    document.querySelector('#registration-btn').addEventListener('click', async () => {
        if (!selectedImageFile) {
            alert('변경된 이미지가 없습니다.');
            return;
        }

        const formData = new FormData();
        formData.append('image', selectedImageFile);

        const response = await fetch('/mypage', {
            method: 'PATCH',
            body: formData,
            credentials: 'include',
        });

        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

        if (!response.ok) {
            alert('이미지는 필수 값입니다');
            return;
        }

        alert('프로필이 변경되었습니다.');
    });
</script>
</body>
</html>
