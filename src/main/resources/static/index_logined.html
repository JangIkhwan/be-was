<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="./reset.css" rel="stylesheet"/>
    <link href="./global.css" rel="stylesheet"/>
    <link href="./main.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <header class="header">
        <a href="/"><img src="./img/signiture.svg"/></a>
        ${{header_menu}}
    </header>
    <div class="wrapper">
        ${{article}}
        <nav class="nav">
            <ul class="nav__menu">
                <li class="nav__menu__item">
                    <a class="nav__menu__item__btn" href="">
                        <img
                                class="nav__menu__item__img"
                                src="./img/ci_chevron-left.svg"
                        />
                        이전 글
                    </a>
                </li>
                <li class="nav__menu__item">
                    <a class="btn btn_ghost btn_size_m">댓글 작성</a>
                </li>
                <li class="nav__menu__item">
                    <a class="nav__menu__item__btn" href="">
                        다음 글
                        <img
                                class="nav__menu__item__img"
                                src="./img/ci_chevron-right.svg"
                        />
                    </a>
                </li>
            </ul>
        </nav>
        <div>
            <a class="btn btn_contained btn_size_s" href="/article/create-form">
                글쓰기
            </a>
        </div>
    </div>
</div>
<script>
const likeButtons = document.querySelectorAll(".like-btn");

likeButtons.forEach(button => {
    button.addEventListener("click", async () => {
        const articleId = button.dataset.articleId;

        try {
            const response = await fetch(`/article/${articleId}/like`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            });

            if (response.redirected) {
                window.location.href = response.url;
                return;
            }

            if (!response.ok) {
                throw new Error("좋아요 실패");
            }
        } catch (error) {
            console.error(error);
            alert("좋아요 처리 중 오류 발생");
        }
    });
});
</script>
</body>
</html>
